name: TRACE Delivery Checks

on:
  push:
    branches:
      - fix/trace-delivery-critical-path
  pull_request:
    branches:
      - feature/trace-frontend-v2

permissions:
  contents: read

concurrency:
  group: trace-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.2.2
      - name: Setup Node.js 24
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run test suite
        run: npm run check:frontend
      - name: Build TRACE
        run: npm run build --workspace @personal/trace
      - name: Refresh audited read-only showcase from committed records
        run: node tooling/trace-showcase-refresh.mjs
      - name: Verify serverless live API is closed without secrets
        run: node tooling/trace-serverless-smoke.mjs
      - name: Install Chromium for UI smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke on desktop and mobile with three locked cases
        run: |
          python3 -m http.server 4400 --directory delivery/trace-showcase >/tmp/trace-static-server.log 2>&1 &
          sleep 2
          node tooling/trace-ui-smoke.mjs
      - name: Archive showcase and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-delivery-preview
          path: |
            delivery/trace-showcase
            delivery/trace-review-screenshots
          if-no-files-found: warn
          retention-days: 7
