name: TRACE Delivery Checks

on:
  push:
    branches:
      - fix/trace-delivery-critical-path
  pull_request:
    branches:
      - feature/trace-frontend-v2

permissions:
  contents: read

concurrency:
  group: trace-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d275973d656f9d2b15 # v4.2.2
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run test suite
        run: npm run check:frontend
      - name: Build TRACE
        run: npm run build --workspace @personal/trace
